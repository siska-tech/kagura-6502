# KAGURA-6502 BIOS, Boot ROM 4 KiB ($F000-$FFFF)
MEMORY {
    ZP:   start = $00F0, size = $0010, type = rw;
    ROM:  start = $F000, size = $1000, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    BIOS:    load = ROM, type = ro;
    JUMPTAB: load = ROM, type = ro, start = $FF00;
    VECTORS: load = ROM, type = ro, start = $FFFA;
}

# KAGURA-6502 BASIC "fastcode" image: same as kagura.cfg, but the CODE segment
# (7.3 KiB, the interpreter proper) RUNS from fast RAM $0300-$1FFF. It is stored in
# the PSRAM image and copied there by the BIOS (header copy descriptor) before the
# cold start. Program memory then starts at $2000 (RAMSTART with FASTCODE).
# Needs the 8 KiB fast RAM build to be fast (with 2 KiB the copy lands in PSRAM).
MEMORY {
    ZP:      start = $0000, size = $00F0, type = rw;           # $F0-$FF reserved for the BIOS
    FASTRAM: start = $0300, size = $1D00, type = rw, file = "";  # $0300-$1FFF
    KIMAGE:  start = $9800, size = $2800, type = ro, fill = no, file = %O;   # $9800-$BFFF
    DUMMY:   start = $0000, size = $00FF, file = "";
}
SEGMENTS {
    KHDR:     load = KIMAGE, type = ro;
    HEADER:   load = KIMAGE, type = ro;
    VECTORS:  load = KIMAGE, type = ro;
    KEYWORDS: load = KIMAGE, type = ro;
    ERROR:    load = KIMAGE, type = ro;
    CODE:     load = KIMAGE, run = FASTRAM, type = ro, define = yes;
    CHRGET:   load = KIMAGE, type = ro;
    INIT:     load = KIMAGE, type = ro;
    EXTRA:    load = KIMAGE, type = ro, define = yes;
    ZEROPAGE: load = ZP, type = zp;
    DUMMY:    load = DUMMY;   # not included in the image
}
SYMBOLS {
    __KIMAGE_END__: type = export, value = __EXTRA_RUN__ + __EXTRA_SIZE__;
}
